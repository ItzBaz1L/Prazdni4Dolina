<title>Праздничная долина</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#161325;color:#e6e5f1;font:15px Arial,sans-serif}
header{padding:18px 25px;border-bottom:1px solid #343044}
h1{font-size:19px;font-weight:500;margin:0}
#status{font-size:12px;color:#ac98fa;margin-top:7px}
main{display:grid;place-items:center;padding:20px}
.wheel{width:min(900px,96vw);position:relative;aspect-ratio:1;
    padding:18px;border-radius:50%;background:rgba(27, 22, 42, 0.19);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    border:1px solid rgba(229, 220, 255, 0.12);
    box-shadow:
    0 10px 45px rgba(0, 0, 0, .10),
    inset 0 0 35px rgba(228, 220, 255, 0.025);}
.wheel svg{width:100%;height:100%;display:block;}
svg{width:100%;height:100%}
.season{fill:#b6aec8;font-size:13px;letter-spacing:2px;pointer-events:none;}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36%;height:36%;background:#1e1b2c;border:1px solid #3c3953;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px}
.center small{color:#9a92ae;font-size:10px;letter-spacing:1px}
#timer{font-size:clamp(17px,3vw,27px);margin:12px 0;font-variant-numeric:tabular-nums}
#timerName{font-size:13px;color:#c3b9d9}
.marker{cursor:pointer;stroke:#14111b;stroke-width:2}
.marker:hover{filter:drop-shadow(0 0 7px white)}
.line{stroke:#5c5371;opacity:.45}
#tooltip{position:fixed;display:none;z-index:20;width:min(420px,calc(100vw - 20px));padding:16px;background:#242033;border:1px solid #5b5376;box-shadow:0 12px 35px rgba(0, 0, 0, 0.733)}
#tooltip.visible{display:block}
.people{display:grid;grid-template-columns:1fr;gap:15px}
.person+.person{border-left:1px solid #504865;padding-left:15px}
.person {min-width:0;}
.person h2{font-size:17px;font-weight:500;margin:0 0 12px}
.profile{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:15px}
.date{padding-bottom:10px;border-bottom:1px solid #504865;color:#c0b8dc}
.interests{width:100%;margin-top:12px;padding:12px;background:#1c1727;border-left:2px solid #9c91c5}
.interests small{display:block;color:#9c9abd;font-size:10px;letter-spacing:1px;margin-bottom:7px}
.interests div{font-size:13px;line-height:1.6;overflow-wrap:anywhere;word-break:normal;}
.pinned-group + .pinned-group{border-top:1px solid #5c5376;margin-top:16px;padding-top:16px;}
.photo{width:90px;height:120px;object-fit:cover;background:#363046}
button{margin-top:14px;background:transparent;border:1px solid #6e668d;color:#e8e5f1;padding:8px 12px;cursor:pointer}
button:hover{background:#353049}
.duplicate{font-size:12px;color:#c0b8dc;margin-bottom:12px}
@media(max-width:500px){.center{width:42%;height:42%}.season{font-size:10px}.wheel{width:98vw; padding:12px;}.profile{grid-template-columns:minmax(0,1fr) 75px}.photo{width:75px;height:110px}}



body {
  background: transparent;
  min-height: 100vh;
}
header {
  position: relative;
  z-index: 2;
}
main {
  position: relative;
  z-index: 1;
}

/*СТЕКЛЯННЫЕ ПАНЕЛИ*/
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  position: relative;
  background: rgba(25, 20, 37, 0.767);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(231, 220, 255, 0.15);
}
.center {
  background: rgba(25, 20, 37, .78);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(231,220,255,.2);
}
#tooltip {
  z-index: 10;
}

/*КНОПКА ФОНА*/
.theme-toggle {
  margin: 0;
  flex-shrink: 0;
  padding: 9px 14px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(231,220,255,.25);
  color: #e5eaf1;
  font-size: 12px;
  transition: background .2s;
}
.theme-toggle:hover {
  background: rgba(255,255,255,.17);
}
@media(max-width:500px) {
  header {
    padding: 14px;
  }
  .theme-toggle {
    padding: 8px;
    font-size: 11px;
  }
}


/*ФОН*/
:root {--header-height: 75px;}
#background {
  position: fixed;
  top: var(--header-height);
  left: 0;
  right: 0;
  bottom: 0;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background-color: #14111b;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}
#background img,
#background iframe{
  position: absolute;
  top: 50%;
  left: 50%;
  width: max(100%, calc((100vh - var(--header-height)) * 16 / 9));
  height: max(100%, calc(100vw * 9 / 16));
  transform: translate(-50%, -50%);
  border: none;
  pointer-events: none;
}
#background video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

#background-overlay {
  position: fixed;
  top: var(--header-height);
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 0;
  background: rgba(8, 12, 19, .58);
  pointer-events: none;
}


/* НОВАЯ КОМПОНОВКА!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!*/
/* Рабочая область под шапкой */
main {
  position: relative;
  z-index: 1;
  min-height: calc(100vh - var(--header-height));
  min-height: calc(100svh - var(--header-height));
  display: grid;
  place-items: center;
  padding: 16px;
}

/* Колесо */
.wheel {
  width: min(740px, 92vw, calc(100svh - var(--header-height) - 24px));
  aspect-ratio: 1;
  position: relative;
  padding: 0;

  background: transparent;
  border: none;
  border-radius: 50%;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;}

/* Блюр кольцо с прозрачным центром */
.wheel::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: 50%;

  background: rgba(22, 30, 42, .19);
  border: 1px solid rgba(229, 220, 255, .12);

  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);

  box-shadow:
    0 10px 45px rgba(0, 0, 0, .10),
    inset 0 0 35px rgba(228, 220, 255, .025);

  /* Прозрачное отверстие в центре */
  -webkit-mask-image: radial-gradient(
    circle,
    transparent 0%,
    transparent 38%,
    black 39%,
    black 100%
  );

  mask-image: radial-gradient(
    circle,
    transparent 0%,
    transparent 38%,
    black 39%,
    black 100%
  );

  pointer-events: none;}

/* SVG поверх блюр кольца */
.wheel svg {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: block;}

/* Названия времён года */
.season {
  fill: #c8bfdc;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 1px;
  pointer-events: none;
  text-anchor: middle;
  dominant-baseline: middle;
}

/* Центральная круглая подложка */
.center {
  position: absolute;
  z-index: 2;

  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);

  width: 34%;
  height: 34%;
  aspect-ratio: 1;

  border-radius: 50%;
  padding: 10px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;

  background: rgba(25, 20, 37, .86);
  border: 1px solid rgba(231, 220, 255, .25);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow: 0 5px 25px rgba(0, 0, 0, .2);}

.center small {
  font-size: clamp(7px, 1vw, 10px);
  letter-spacing: .7px;
  line-height: 1.4;}

#timer {
  font-size: clamp(12px, 2.5vw, 25px);
  margin: 8px 0;}

#timerName {
  font-size: clamp(9px, 1.5vw, 13px);
  overflow-wrap: anywhere;}

/* Точки */
.marker {
  stroke: color-mix(in srgb, var(--marker-color), black 30%);
  stroke-width: 3.5px;
  stroke-linejoin: round;
  stroke-linecap: round;
  paint-order: stroke fill;
  shape-rendering: geometricPrecision;
  vector-effect: non-scaling-stroke;
  transition:
    filter .2s ease,
    stroke .2s ease,
    stroke-width .2s ease;
}
.marker:hover {
  stroke: #fff;
  stroke-width: 4px;
  filter:
    drop-shadow(0 0 3px var(--marker-color))
    drop-shadow(0 0 8px var(--marker-color))
    drop-shadow(0 0 14px var(--marker-color));
}


/* Общая область фона */
#background {
  position: fixed;
  inset: var(--header-height) 0 0 0;
  z-index: 0;
  overflow: hidden;
  background-color: #241e35;
}

/* Единое центрирование изображений, видео и Embed */
#background img,
#background iframe,
#background video {
  position: absolute;
  top: 50%;
  left: 50%;

  width: 100%;
  height: 100%;

  transform: translate(-50%, -50%);
  border: none;
  object-fit: cover;
  object-position: center center;
  pointer-events: none;
}

/* Затемнение */
#background-overlay {
  position: fixed;
  inset: var(--header-height) 0 0 0;
  z-index: 0;
  background: rgba(16, 12, 27, 0.37);
  pointer-events: none;
}

/* Планшеты и телефоны */
@media (max-width: 600px) {
  main {
    padding: 12px;  }
  .wheel {
    width: min(96vw, calc(100svh - var(--header-height) - 20px));  }
  .center {
    width: 38%;
    height: 38%;
    padding: 7px;  }
  .season {
    font-size: 10px;
    letter-spacing: .5px;  }
  #tooltip {
    max-height: 85vh;
    overflow-y: auto;  }
  #tooltip::before {
    padding: 5px 0 14px;}}

@media (max-height: 600px) {
  .wheel {
    width: min(76vw, calc(100svh - var(--header-height) - 20px));  }
  #tooltip {
    max-height: 85vh;
    overflow-y: auto;  }
  #tooltip::before {
    padding: 5px 0 14px;}}

/* ПЕРЕМЕЩАЕМАЯ КАРТОЧКА */
#tooltip {
  cursor: default;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
/* Полоса */
#tooltip::before {
  content: "⠿  Переместить карточку";
  display: block;
  text-align: center;
  color: #bbafe49d;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 0 0 12px;
  cursor: grab;
}
#tooltip.dragging::before {
  cursor: grabbing;
}
#tooltip.dragging {
  opacity: .92;
}

/*МАРКЕР ТЕКУЩЕЙ ДАТЫ*/
.today-marker {
  stroke: #eee5ff;
  stroke-width: 1.8;
  stroke-linecap: round;
  opacity: .95;
  filter: drop-shadow(0 0 3px #c5aaff)
          drop-shadow(0 0 5px rgba(197,170,255,.65));
  pointer-events: none;
  vector-effect: non-scaling-stroke;
}

/*сдвг по бокам*/
#background.side-mode {
  display: grid;
  grid-template-columns: 1fr 3fr 1fr;
  gap: 10px;
  align-items: stretch;
  padding: 0 10px;}
#background.side-mode > img,
#background.side-mode > iframe,
#background.side-mode > video {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 60%;
  height: 100%;
  transform: translate(-50%, -50%);
  object-fit: contain;
  z-index: 1;}
.side-brainrot {
  position: absolute;
  top: 0;
  width: 19%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  z-index: 2;}
.side-brainrot.left {
  left: 0;}
.side-brainrot.right {
  right: 0;}
@media(max-width: 700px) {
  #background.side-mode > img,
  #background.side-mode > iframe,
  #background.side-mode > video {
    width: 100%;
    height: 100%;  }
  .side-brainrot {
    display: none;  }}

</style>
</head>

<main>

<script>
const SHEET_ID="1H8JM7nr8f2moRBVroHakqZWCOwkbq6OrREMwL8Pathk";
const SHEET_GID="0";

let people=[];

let hovered=false;
const NS="http://www.w3.org/2000/svg";
const tooltip=document.getElementById("tooltip");
const markers=document.getElementById("markers");
const divisions=document.getElementById("divisions");
const todayMarker = document.getElementById("todayMarker");

//перетаскивание закреплённой карточки
let tooltipDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;
let tooltipMoved = false;
tooltip.addEventListener("pointerdown", (e) => {
  //не начинаем перетаскивание при нажатии на кнопки
  if (e.target.closest("button")) return;
  tooltipDragging = true;
  tooltipMoved = true;
  const rect = tooltip.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  tooltip.classList.add("dragging");
  tooltip.setPointerCapture(e.pointerId);
  e.preventDefault();});
tooltip.addEventListener("pointermove", (e) => {
  if (!tooltipDragging) return;
  const w = tooltip.offsetWidth;
  const h = tooltip.offsetHeight;
  let x = e.clientX - dragOffsetX;
  let y = e.clientY - dragOffsetY;
  x = Math.max(0, Math.min(innerWidth - w, x));
  y = Math.max(0, Math.min(innerHeight - h, y));
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";});
function stopTooltipDrag() {
  tooltipDragging = false;
  tooltip.classList.remove("dragging");}
tooltip.addEventListener("pointerup", stopTooltipDrag);
tooltip.addEventListener("pointercancel", stopTooltipDrag);

//Авто высота шапки
const header = document.querySelector("header");
function updateHeaderHeight() {
  document.documentElement.style.setProperty(
    "--header-height",
    header.offsetHeight + "px");}
updateHeaderHeight();
window.addEventListener("resize", updateHeaderHeight);
new ResizeObserver(updateHeaderHeight).observe(header);

const months=["января","февраля","марта","апреля","мая","июня",
"июля","августа","сентября","октября","ноября","декабря"];

function parseDate(value, formatted) {
  const v = String(value ?? "").trim();
  const f = String(formatted ?? "").trim();

  // Date(_,_,_)
  let m = v.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/);
  if (m) {
    return { day: +m[3], month: +m[2] + 1 };
  }

  // yyyy-mm-dd
  m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return { day: +m[3], month: +m[2] };

  // dd.mm.yyyy
  m = (f || v).match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?$/);
  if (m) return { day: +m[1], month: +m[2] };

  // dd/mm/yyyy
  m = (f || v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return { day: +m[1], month: +m[2] };

  // Google Sheets serial number
  if (typeof value === "number") {
    const d = new Date(Date.UTC(1899, 11, 30) + value * 86400000);
    return { day: d.getUTCDate(), month: d.getUTCMonth() + 1 };
  }

  return null;
}

function valid(d){
 return d&&d.month>=1&&d.month<=12&&d.day>=1&&d.day<=new Date(2025,d.month,0).getDate();
}
function key(d){return d.month+"-"+d.day}
const CALENDAR_SHIFT = 15;
function angle(d) {
  const yearStart = Date.UTC(2025, 0, 1);
  const yearLength = 365;

  const day = (
    Date.UTC(2025, d.month - 1, d.day) - yearStart
  ) / 86400000;

  const shiftedDay = day - CALENDAR_SHIFT;

  return -Math.PI / 2 -
    (shiftedDay / yearLength) * Math.PI * 2;
}
function color(s){
 let h=0;
 for(let c of s)h=(h*31+c.charCodeAt(0))>>>0;
 return ["#e5a16f","#8eb9df","#c19ad9","#8dc3a5","#e1b77b","#dc8c9a","#83c9ca","#c3b58b"]
 [h%8];
}
function point(d, radius = 225){
 let a=angle(d);
 return {x:300+radius*Math.cos(a),y:300+radius*Math.sin(a)};
}

//ОТОБРАЖЕНИЕ ТЕКУЩЕЙ ДАТЫ
function drawTodayMarker() {
  const now = new Date();
  //Точный номер дня с учётом времени суток
  const yearStart = new Date(now.getFullYear(), 0, 1);
  const yearLength = (
    new Date(now.getFullYear() + 1, 0, 1) - yearStart
  ) / 86400000;
  const day = (
    now - yearStart
  ) / 86400000;
  //Угол с учётом смещения календаря
  const a = -Math.PI / 2 -
    ((day - CALENDAR_SHIFT) / yearLength) * Math.PI * 2;
  //Внутренняя и внешняя границы черты
  const innerRadius = 205;
  const outerRadius = 245;
  const x1 = 300 + innerRadius * Math.cos(a);
  const y1 = 300 + innerRadius * Math.sin(a);
  const x2 = 300 + outerRadius * Math.cos(a);
  const y2 = 300 + outerRadius * Math.sin(a);
  todayMarker.innerHTML = "";
  const line = document.createElementNS(NS, "line");
  line.setAttribute("x1", x1);
  line.setAttribute("y1", y1);
  line.setAttribute("x2", x2);
  line.setAttribute("y2", y2);
  line.setAttribute("class", "today-marker");
  todayMarker.appendChild(line);
}

function draw(){
 // Границы месяцев с учётом смещения календаря
divisions.innerHTML = "";
for (let i = 0; i < 12; i++) {
    const date = {
        day: 1,
        month: i + 1
    };
    const a = angle(date);
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 300 + 205 * Math.cos(a));
    l.setAttribute("y1", 300 + 205 * Math.sin(a));
    l.setAttribute("x2", 300 + 245 * Math.cos(a));
    l.setAttribute("y2", 300 + 245 * Math.sin(a));
    l.setAttribute("class", "line");
    divisions.append(l);
}
 
    markers.innerHTML="";
    let groups={};
    people.forEach(p=>(groups[key(p.date)]??=[]).push(p));

    Object.entries(groups).forEach(([k,g])=>{
 // Сортируем даты по календарному порядку
    const entries = Object.entries(groups).sort((a, b) => {
    const da = a[1][0].date;
    const db = b[1][0].date;
    return (
        Date.UTC(2025, da.month - 1, da.day) -
        Date.UTC(2025, db.month - 1, db.day)
    );
});

// Радиусы для близких дат
const radii = [218, 222, 214, 224, 210, 220, 216];
let cluster = [];
let previousDay = null;
function dayNumber(d) {
  return (
    Date.UTC(2025, d.month - 1, d.day) -
    Date.UTC(2025, 0, 1)
  ) / 86400000;
}
function drawCluster(items) {
  items.forEach(([k, g], index) => {
    const radius = items.length > 1
      ? radii[index % radii.length]
      : 220;

    const p = point(g[0].date, radius);
    let c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", p.x);
    c.setAttribute("cy", p.y);
    c.setAttribute("r", 7);
    const markerColor = color(g.map(x => x.name).join("|"));
    c.setAttribute("fill", markerColor);
    c.style.setProperty("--marker-color", markerColor);
    c.setAttribute("stroke", markerColor);
    c.setAttribute("class", "marker");
    c.addEventListener("mouseenter", () => show(k, c));
    c.addEventListener("mouseleave", () => {
     hovered = false;
     setTimeout(checkHide, 150);});
    c.addEventListener("click", () => show(k, c));
    markers.append(c);});
}

// Объединяем близкие даты в группы
entries.forEach(entry => {
  const currentDay = dayNumber(entry[1][0].date);
  if (
    previousDay !== null &&
    currentDay - previousDay > 4
  ) {
    drawCluster(cluster);
    cluster = [];
  }
  cluster.push(entry);
  previousDay = currentDay;
});
if (cluster.length) {
  drawCluster(cluster);
}
});
}

function esc(s){
 return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':
 "&quot;","'":"&#39;"}[c]));
}

function personHTML(p){
 return `
 <div class="person">
   <div class="profile">
     <div>
       <h2>${esc(p.name)}</h2>
       <div class="date">${p.date.day} ${months[p.date.month-1]}</div>
     </div>
     ${p.image
       ? `<img class="photo" src="${esc(p.image)}" alt="" onerror="this.style.display='none'">`
       : `<div class="photo"></div>`
     }
   </div>

   <div class="interests">
     <small>ИНТЕРЕСЫ</small>

   </div>
 </div>`;
}


let hoveredKey = null;

// Формирование содержимого карточек
function renderTooltip(el) {
  const keys = [...pinned];
  if (hoveredKey && !keys.includes(hoveredKey)) {
    keys.push(hoveredKey);  }
  if (!keys.length) {
    tooltip.classList.remove("visible");
    return;  }

  tooltip.innerHTML = keys.map(k => {
    const group = people.filter(p => key(p.date) === k);
    return `
      <div class="pinned-group">
        ${group.length > 1
          ? `<div class="duplicate">В этот день родились ${group.length} приколыша</div>`
          : ""
        }

        <div class="people">
          ${group.map(personHTML).join("")}
        </div>

        <button class="pin-button" data-key="${k}">
          ${pinned.includes(k)
            ? "Открепить карточку"
            : "Закрепить карточку"
          }
        </button>
      </div>
    `;
  }).join("");

  tooltip.classList.add("visible");

  // Обработчики закрепления
  tooltip.querySelectorAll(".pin-button").forEach(button => {
    button.onclick = () => togglePin(button.dataset.key);
  });

  //Позиционирование
  if (el && !tooltipDragging) {
    const r = el.getBoundingClientRect();
    const w = tooltip.offsetWidth;
    const h = tooltip.offsetHeight;
    //если карточку уже перемещали вручную,
    //сохраняем её положение при обновлении содержимого.
    if (!tooltipMoved) {
      tooltip.style.left =
        Math.max(8, Math.min(innerWidth - w - 8, r.right + 10)) + "px";
      tooltip.style.top =
        Math.max(8, Math.min(innerHeight - h - 8, r.top)) + "px";}}
}

// Показ карточки при наведении
function show(k, el) {
  //при новом открытии карточки
  //разрешаем автоматическое позиционирование.
  if (!tooltip.classList.contains("visible")) {
    tooltipMoved = false;}
  hoveredKey = k;
  active = k;
  hovered = true;
  renderTooltip(el);}

// Закрепление и открепление
function togglePin(k) {
  if (pinned.includes(k)) {
    pinned = pinned.filter(x => x !== k); } 
  else {
    if (pinned.length >= 2) {
      return; }
    pinned.push(k); }
  renderTooltip();
}

// Наведение на карточку
tooltip.addEventListener("mouseenter", () => {
  hovered = true;});
tooltip.addEventListener("mouseleave", () => {
  hovered = false;
  setTimeout(checkHide, 150);});

// Скрытие подсказок
function checkHide() {
  if (hovered) return;
  hoveredKey = null;
  active = null;
  if (pinned.length) {
    renderTooltip();} 
  else {
    tooltip.classList.remove("visible");}
}

function timer(){
 if (!people.length) {
  document.getElementById("timer").textContent = "--";
  document.getElementById("timerName").textContent = "Нет данных";
  return; }
 let now=new Date();
 let next=people.map(p=>{
  let y=now.getFullYear();
  let d=new Date(y,p.date.month-1,p.date.day);
  if(d<=now)d=new Date(y+1,p.date.month-1,p.date.day);
  return {p,d};
 }).sort((a,b)=>a.d-b.d)[0];
 let diff=next.d-now;
 let days=Math.floor(diff/86400000);
 let hours=Math.floor(diff%86400000/3600000);
 let mins=Math.floor(diff%3600000/60000);
 document.getElementById("timer").textContent=days?`${days} дн. ${hours} ч.`:`${hours} ч. ${mins} мин.`;
 document.getElementById("timerName").textContent=next.p.name;
}

async function load() {
  const status = document.getElementById("status");
  status.textContent = "Подключение к Google Таблице...";

  try {
    const url =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
      `?tqx=out:json&gid=${SHEET_GID}`;

    const response = await fetch(url, {
      cache: "no-store"
    });
    if (!response.ok) {
      throw new Error("Google Sheets: HTTP " + response.status);
    }
    const raw = await response.text();
    const match = raw.match(
      /google\.visualization\.Query\.setResponse\(([\s\S]*?)\);?\s*$/
    );
    if (!match) {
      throw new Error("Не удалось прочитать ответ Google. Проверь доступ.");
    }
    const json = JSON.parse(match[1]);
    if (json.status === "error") {
      throw new Error("Google вернул ошибку при чтении таблицы");
    }
    const loaded = [];

    (json.table.rows || []).forEach((row, index) => {
      const c = row.c || [];

      const name = String(c[0]?.v ?? "").trim();
      const date = parseDate(c[1]?.v, c[1]?.f);
      const image = String(c[2]?.v ?? "").trim();
      const interests = String(c[3]?.v ?? "").trim();

      if (!name || !valid(date)) {
        console.warn("Пропущена строка:", index + 2);
        return;
      }
      loaded.push({
        name,
        date,
        image,
        interests
      });
    });

    people = loaded;

    draw();
    timer();

    status.textContent =
      `Именинников: ${people.length} · Обновлено: ` +
      new Date().toLocaleTimeString("ru-RU");

    console.log("Загруженные дни рождения:", people);

  } catch (error) {
    status.textContent = "Ошибка: " + error.message;
    console.error(error);
  }
}

//Случайный выбор двух разных типов видео
function getBrainrotPair() {
  const types = ["subway", "soap"];
  //перемешиваем
  types.sort(() => Math.random() - 0.5);
  return [
    BRAINROT_VIDEOS[types[0]][
      Math.floor(Math.random() * BRAINROT_VIDEOS[types[0]].length)
    ],
    BRAINROT_VIDEOS[types[1]][
      Math.floor(Math.random() * BRAINROT_VIDEOS[types[1]].length)
    ]  ];}
//Создание бокового видео
function addBrainrotVideo(url, side) {
  if (!url || url.startsWith("ССЫЛКА_")) return;
  const video = document.createElement("video");
  video.className = "side-brainrot " + side;
  video.src = url;
  video.autoplay = true;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.preload = "auto";
  background.appendChild(video);
  video.play().catch(console.warn);}
//Запуск двух боковых видео
function startBrainrot() {
  const oldVideos = background.querySelectorAll(".side-brainrot");
  oldVideos.forEach(video => {
    video.pause();
    video.remove();
  });
  const [leftVideo, rightVideo] = getBrainrotPair();
  addBrainrotVideo(leftVideo, "left");
  addBrainrotVideo(rightVideo, "right");}
//Отключение боковых видео
function stopBrainrot() {
  background.querySelectorAll(".side-brainrot").forEach(video => {
    video.pause();
    video.remove();
  });
  background.classList.remove("side-mode");}


let gifEnabled =
  localStorage.getItem("birthdayGifEnabled") !== "false";

// Очистка предыдущего фона
function clearBackground() {
  background.innerHTML = "";
  background.style.backgroundImage = "none";
}

// Установка фона
function setBackground() {

  clearBackground();
  stopBrainrot();

  if (!gifEnabled) {
    document.getElementById("background-overlay").style.background =
      "rgba(8, 12, 19, .96)";

    backgroundToggle.textContent = "Включить фон";
    return;
  }

  const available = BACKGROUNDS.filter(item =>
    item &&
    item.url &&
    !item.url.includes("ВАШ_ID") &&
    !item.url.includes("example.com")
  );

  if (!available.length) {
    backgroundToggle.textContent = "Включить фон";
    return;
  }

  const selected =
    available[Math.floor(Math.random() * available.length)];

  // ПРЯМОЕ ИЗОБРАЖЕНИЕ
  if (selected.type === "image") {

    const img = document.createElement("img");

    img.src = selected.url;
    img.alt = "";
    img.style.cssText = `
      position:absolute;
      width:100%;
      height:100%;
      object-fit:cover;
    `;

    background.appendChild(img);

    img.onerror = () => {
      clearBackground();
      console.error("Не удалось загрузить изображение:", selected.url);
    };
  }

  // ВИДЕО
  else if (selected.type === "video") {
    const video = document.createElement("video");
    video.src = selected.url;
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    background.appendChild(video);
    video.play().catch(console.warn);
  }

  // EMBED
  else if (selected.type === "embed") {
    let embedUrl = selected.url;
    // Если вставлен полный iframe-код, извлекаем из него src
    if (embedUrl.includes("<iframe")) {
      const doc = new DOMParser().parseFromString(
        embedUrl,
        "text/html"
      );
      embedUrl = doc.querySelector("iframe")?.getAttribute("src");
    }

    if (!embedUrl) {
      console.error("Некорректный Embed");
      return;
    }

    const iframe = document.createElement("iframe");
    iframe.src = embedUrl;
    iframe.allow = "autoplay; fullscreen";
    iframe.setAttribute("allowfullscreen", "");
    iframe.setAttribute("loading", "eager");
    iframe.setAttribute("title", "Фоновая анимация");
    background.appendChild(iframe);
  }

  document.getElementById("background-overlay").style.background =
    "rgba(8, 12, 19, .58)";

  backgroundToggle.textContent = "Отключить фон";
  //сдвг видосы только для выбранных фонов
  if (selected.sideVideos) {
    background.classList.add("side-mode");
    startBrainrot();
  }
}
