<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Праздничная долина</title>
<style>

/*ОСНОВА*/
* {box-sizing: border-box;}
:root {
  --header-height: 75px;
  --background: #14111b;
  --panel: rgba(25, 20, 37, .86);
  --panel-border: rgba(231, 220, 255, .25);
  --text: #e6e5f1;
  --muted: #9c9abd;
  --accent: #9c91c5;
  --border: #504865;}
body {
  margin: 0;
  min-height: 100vh;
  background: transparent;
  color: var(--text);
  font: 15px Arial, sans-serif;
}

/*ШАПКА*/
header {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 18px 25px;
  background: rgba(25, 20, 37, .767);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(231, 220, 255, .15);}
.header-info {min-width: 0;}
.header-title {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;}
h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 500;}
.version-info {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  color: #a99cc9;
  font-size: 11px;
  letter-spacing: .3px;}
.version-info span {white-space: nowrap;}
#status {
  margin-top: 7px;
  color: #ac98fa;
  font-size: 12px;
}

/*КНОПКА ФОНА*/
.theme-toggle {
  flex-shrink: 0;
  margin: 0;
  padding: 9px 14px;
  background: rgba(255, 255, 255, .07);
  border: 1px solid rgba(231, 220, 255, .25);
  color: #e5eaf1;
  font-size: 12px;
  cursor: pointer;
  transition: background .2s;}
.theme-toggle:hover {
  background: rgba(255, 255, 255, .17);
}

/*ФОНОВЫЙ СЛОЙ*/
#background {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background-color: #14111b;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;}
#background img,
#background iframe,
#background video {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100%;
  height: 100%;
  transform: translate(-50%, -50%);
  border: none;
  object-fit: cover;
  object-position: center center;
  pointer-events: none;}
#background-overlay {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: rgba(16, 12, 27, .37);
  pointer-events: none;
}

/*ОСНОВНАЯ ОБЛАСТЬ*/
main {
  position: relative;
  z-index: 1;
  min-height: calc(100vh - var(--header-height));
  min-height: calc(100svh - var(--header-height));
  display: grid;
  place-items: center;
  padding: 16px;
}

/*КОЛЕСО КАЛЕНДАРЯ*/
.wheel {
  position: relative;
  width: min(
    740px,
    92vw,
    calc(100svh - var(--header-height) - 24px));
  aspect-ratio: 1;
  padding: 0;
  background: transparent;
  border: none;
  border-radius: 50%;
  box-shadow: none;
}

/*Стеклянное кольцо*/
.wheel::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: 50%;
  background: rgba(22, 30, 42, .19);
  border: 1px solid rgba(229, 220, 255, .12);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  box-shadow:
    0 10px 45px rgba(0, 0, 0, .10),
    inset 0 0 35px rgba(228, 220, 255, .025);
  -webkit-mask-image: radial-gradient(
    circle,
    transparent 0%,
    transparent 38%,
    black 39%,
    black 100%
  );
  mask-image: radial-gradient(
    circle,
    transparent 0%,
    transparent 38%,
    black 39%,
    black 100%
  );
  pointer-events: none;
}

/*SVG*/
.wheel svg {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
}

/*ВРЕМЕНА ГОДА*/
.season {
  fill: #c8bfdc;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 1px;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

/*ЦЕНТРАЛЬНАЯ ПАНЕЛЬ*/
.center {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 34%;
  height: 34%;
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px;
  text-align: center;
  border-radius: 50%;
  border: 1px solid var(--panel-border);
  background: var(--panel);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 5px 25px rgba(0, 0, 0, .2);}
.center small {
  color: #9a92ae;
  font-size: clamp(7px, 1vw, 10px);
  letter-spacing: .7px;
  line-height: 1.4;}
#timer {
  margin: 8px 0;
  font-size: clamp(12px, 2.5vw, 25px);
  font-variant-numeric: tabular-nums;}
#timerName {
  color: #c3b9d9;
  font-size: clamp(9px, 1.5vw, 13px);
  overflow-wrap: anywhere;
}

/*МАРКЕРЫ И РАЗДЕЛИТЕЛИ*/
.marker {
  cursor: pointer;
  stroke: color-mix(in srgb, var(--marker-color), black 30%);
  stroke-width: 3.5px;
  stroke-linejoin: round;
  stroke-linecap: round;
  paint-order: stroke fill;
  shape-rendering: geometricPrecision;
  vector-effect: non-scaling-stroke;
  transition:
    filter .2s ease,
    stroke .2s ease,
    stroke-width .2s ease;}
.marker:hover {
  stroke: #fff;
  stroke-width: 4px;
  filter:
    drop-shadow(0 0 3px var(--marker-color))
    drop-shadow(0 0 8px var(--marker-color))
    drop-shadow(0 0 14px var(--marker-color));}
.line {stroke: #5c5371; opacity: .45;}
.today-marker {
  stroke: #eee5ff;
  stroke-width: 1.8;
  stroke-linecap: round;
  opacity: .95;
  filter:
    drop-shadow(0 0 3px #c5aaff)
    drop-shadow(0 0 5px rgba(197, 170, 255, .65));
  pointer-events: none;
  vector-effect: non-scaling-stroke;
}

/*ВСПЛЫВАЮЩАЯ КАРТОЧКА*/
#tooltip {
  position: fixed;
  z-index: 10;
  display: none;
  width: min(420px, calc(100vw - 20px));
  max-height: 85vh;
  overflow-y: auto;
  padding: 16px;
  background: #242033;
  border: 1px solid #5b5376;
  box-shadow: 0 12px 35px rgba(0, 0, 0, .733);
  cursor: default;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;}
#tooltip.visible {
  display: block;
}

/* Перемещение */
#tooltip::before {
  content: "⠿  Переместить карточку";
  display: block;
  padding: 0 0 12px;
  text-align: center;
  color: #bbafe49d;
  font-size: 11px;
  letter-spacing: 1px;
  cursor: grab;}
#tooltip.dragging::before {
  cursor: grabbing;}
#tooltip.dragging {opacity: .92;}

/*ЛЮДИ И ПРОФИЛИ*/
.people {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;}
.person {min-width: 0;}
.person + .person {
  padding-left: 15px;
  border-left: 1px solid #504865;}
.person h2 {
  margin: 0 0 12px;
  font-size: 17px;
  font-weight: 500;}
.profile {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 90px;
  gap: 15px;}
.date {
  padding-bottom: 10px;
  color: #c0b8dc;
  border-bottom: 1px solid #504865;}
.photo {
  width: 90px;
  height: 120px;
  object-fit: cover;
  background: #363046;
}

/*ИНТЕРЕСЫ И РЕФЕРЕНСЫ*/
.interests,
.references {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  background: #1c1727;
  border-left: 2px solid #9c91c5;}
.interests small,
.references small {
  display: block;
  margin-bottom: 7px;
  color: #9c9abd;
  font-size: 10px;
  letter-spacing: 1px;}
.interests div,
.references div {
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
  word-break: normal;}
.references {
  background: rgba(35, 28, 49, .85);
  border-left-color: #83a9c9;}
.references small {color: #83a9c9;}

/*Ссылки*/
.reference-link {
  position: relative;
  z-index: 5;
  color: #a9c9f5;
  text-decoration: underline;
  text-decoration-color: rgba(169, 201, 245, .5);
  cursor: pointer;
  user-select: text;
  -webkit-user-select: text;
  overflow-wrap: anywhere;
  transition: color .2s;}
.reference-link:hover {
  color: #fff;
  text-decoration-color: #fff;
}

/*ЗАКРЕПЛЁННЫЕ КАРТОЧКИ*/
.pinned-group + .pinned-group {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid #5c5376;}
.duplicate {
  margin-bottom: 12px;
  color: #c0b8dc;
  font-size: 12px;
}

/*КНОПКИ КАРТОЧЕК*/
button {
  margin-top: 14px;
  padding: 8px 12px;
  color: #e8e5f1;
  background: transparent;
  border: 1px solid #6e668d;
  cursor: pointer;
}
button:hover {background: #353049;}

/*ФОНОВЫЕ ВИДЕО ПО КРАЯМ*/
#background.side-mode {
  display: grid;
  grid-template-columns: 20% 60% 20%;
  align-items: stretch;
  overflow: hidden;}
.brainrot-slot,
.brainrot-center {
  position: relative;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;}
.brainrot-slot {
  z-index: 2;}
.brainrot-slot video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;}
.brainrot-center {
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #14111b;}
.brainrot-center > img,
.brainrot-center > video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;}
.brainrot-center > iframe {
  position: absolute !important;
  inset: 0 !important;
  display: block;
  width: 100% !important;
  height: 100% !important;
  border: 0;
  transform: none !important;
}

/* Планшеты и телефоны */
@media (max-width: 700px) {
  #background.side-mode {display: block;}
  .brainrot-slot {display: none;}
  .brainrot-center {
    width: 100%;
    height: 100%;}}
@media (max-width: 600px) {
  header {padding: 14px;}
  .header-title {
    align-items: flex-start;
    flex-direction: column;
    gap: 7px;}
  .version-info {
    gap: 5px 10px;
    font-size: 10px;}
  .theme-toggle {
    padding: 8px;
    font-size: 11px;}
  main {padding: 12px;}
  .wheel {
    width: min(
      96vw,
      calc(100svh - var(--header-height) - 20px));}
  .center {
    width: 38%;
    height: 38%;
    padding: 7px;}
  .season {
    font-size: 10px;
    letter-spacing: .5px;}
  .profile {
    grid-template-columns: minmax(0, 1fr) 75px;}
  .photo {
    width: 75px;
    height: 110px;
  }}
/* Небольшая высота экрана */
@media (max-height: 600px) {
  .wheel {
    width: min(76vw, calc(100svh - var(--header-height) - 20px));}
}
</style>
</head>

<body>

  <!-- ФОНОВЫЙ СЛОЙ -->
  <div id="background"></div>
  <div id="background-overlay"></div>

  <!-- ШАПКА -->
  <header>
    <div class="header-info">
      <div class="header-title">
        <h1>Праздничная долина</h1>

        <div class="version-info">
          <span>Версия 1.1.2</span>
          <span>20.11.2026</span>
        </div>
      </div>
      <div id="status">Загрузка...</div>
    </div>
    <button id="backgroundToggle" class="theme-toggle">
      Отключить фон
    </button>
  </header>

  <!-- ОСНОВНАЯ ОБЛАСТЬ -->
  <main>
    <!-- КОЛЕСО КАЛЕНДАРЯ -->
    <div class="wheel">
      <svg viewBox="0 0 600 600"
           xmlns="http://www.w3.org/2000/svg">
        <circle cx="300" cy="300" r="245"
                fill="none" stroke="#303b48"/>
        <circle cx="300" cy="300" r="205"
                fill="none" stroke="#303b48"/>
        <!-- Разделители месяцев -->
        <g id="divisions"></g>
        <!-- Маркер текущей даты -->
        <g id="todayMarker"></g>
        <!-- Времена года -->
        <text class="season" x="300" y="27">ЗИМА</text>
        <text class="season" x="300" y="579">ЛЕТО</text>
        <text class="season" x="27" y="305">ВЕСНА</text>
        <text class="season" x="573" y="305">ОСЕНЬ</text>
        <!-- Дни рождения -->
        <g id="markers"></g>
      </svg>
      <!--ЦЕНТРАЛЬНЫЙ ТАЙМЕР-->
      <div class="center">
        <small>БЛИЖАЙШИЙ ДЕНЬ РОЖДЕНИЯ</small>
        <div id="timer">--</div>
        <div id="timerName">Загрузка...</div>
      </div>
    </div>
  </main>
  <!--ВСПЛЫВАЮЩИЕ КАРТОЧКИ -->
  <div id="tooltip"></div>

  <script>
  //НАСТРОЙКИ
  const SHEET_ID = "1H8JM7nr8f2moRBVroHakqZWCOwkbq6OrREMwL8Pathk";
  const SHEET_GID = "0";

  const REFRESH = 300000;
  const CALENDAR_SHIFT = 15;

  const VERSION = "1.1.0";

  const NS = "http://www.w3.org/2000/svg";

  const months = [
    "января", "февраля", "марта", "апреля",
    "мая", "июня", "июля", "августа",
    "сентября", "октября", "ноября", "декабря"];

  //ЭЛЕМЕНТЫ СТРАНИЦЫ
  const tooltip = document.getElementById("tooltip");
  const markers = document.getElementById("markers");
  const divisions = document.getElementById("divisions");
  const todayMarker = document.getElementById("todayMarker");

  const header = document.querySelector("header");
  const background = document.getElementById("background");
  const backgroundToggle = document.getElementById("backgroundToggle");
  const backgroundOverlay = document.getElementById("background-overlay");

  const status = document.getElementById("status");
  const timerElement = document.getElementById("timer");
  const timerNameElement = document.getElementById("timerName");

  //СОСТОЯНИЕ ПРИЛОЖЕНИЯ
  let people = [];

  let pinned = [];
  let hoveredKey = null;

  let hovered = false;
  let active = null;

  let isLoading = false;

  let tooltipDragging = false;
  let dragOffsetX = 0;
  let dragOffsetY = 0;
  let tooltipMoved = false;

  let loadTimer = null;
  let clockTimer = null;
  let todayTimer = null;

  //ОБЩИЕ ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"})
      [char]);}

  function key(date) {return `${date.month}-${date.day}`;}

  function color(value) {
    let hash = 0;
    for (const char of value) {
      hash = (hash * 31 + char.charCodeAt(0)) >>> 0;}
    const colors = [
      "#e5a16f",
      "#8eb9df",
      "#c19ad9",
      "#8dc3a5",
      "#e1b77b",
      "#dc8c9a",
      "#83c9ca",
      "#c3b58b"];
    return colors[hash % colors.length];}

  //РАБОТА С ДАТАМИ
  function parseDate(value, formatted) {
    const v = String(value ?? "").trim();
    const f = String(formatted ?? "").trim();

    let match = v.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/);

    if (match) {
      return {
        day: Number(match[3]),
        month: Number(match[2]) + 1};
    }
    // yyyy-mm-dd
    match = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (match) {
      return {
        day: Number(match[3]),
        month: Number(match[2])};
    }
    // dd.mm.yyyy
    match = (f || v).match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?$/);
    if (match) {
      return {
        day: Number(match[1]),
        month: Number(match[2])};
    }
    // dd/mm/yyyy
    match = (f || v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (match) {
      return {
        day: Number(match[1]),
        month: Number(match[2])};
    }
    // Числовая дата Google Sheets
    if (typeof value === "number" && Number.isFinite(value)) {
      const date = new Date(
        Date.UTC(1899, 11, 30) + value * 86400000);
      return {
        day: date.getUTCDate(),
        month: date.getUTCMonth() + 1};
    }
    return null;
  }
  function valid(date) {
    if (!date || !Number.isInteger(date.day) || !Number.isInteger(date.month)) 
    {return false;}
    if (date.month < 1 || date.month > 12) 
    {return false;}
    const daysInMonth = new Date(2000, date.month, 0).getDate();
    return date.day >= 1 && date.day <= daysInMonth;
  }

  //ГЕОМЕТРИЯ КАЛЕНДАРЯ
  //Используем високосный эталонный год,
  //чтобы корректно учитывать 29 февраля.
  const CALENDAR_YEAR = 2024;
  const CALENDAR_DAYS = 366;
  function angle(date) {
    const yearStart = Date.UTC(CALENDAR_YEAR, 0, 1);
    const day = (Date.UTC(CALENDAR_YEAR, date.month - 1, date.day) - yearStart) / 86400000;
    const shiftedDay = day - CALENDAR_SHIFT;
    return -Math.PI / 2 - (shiftedDay / CALENDAR_DAYS) * Math.PI * 2;
  }
  function point(date, radius = 225) {
    const a = angle(date);
    return {x: 300 + radius * Math.cos(a), y: 300 + radius * Math.sin(a)};
  }
  function dayNumber(date) {
    return 
    (Date.UTC(CALENDAR_YEAR, date.month - 1, date.day) - Date.UTC(CALENDAR_YEAR, 0, 1)) / 86400000;
  }

  //РАЗДЕЛИТЕЛИ МЕСЯЦЕВ
  function drawDivisions() {
    divisions.innerHTML = "";
    for (let month = 1; month <= 12; month++) {
      const p = point({day: 1, month}, 205);
      const p2 = point({day: 1, month}, 245);
      const line = document.createElementNS(NS, "line");
      line.setAttribute("x1", p.x);
      line.setAttribute("y1", p.y);
      line.setAttribute("x2", p2.x);
      line.setAttribute("y2", p2.y);
      line.setAttribute("class", "line");
      divisions.appendChild(line);}
  }

  //МАРКЕР ТЕКУЩЕЙ ДАТЫ
  function drawTodayMarker() {
    const now = new Date();
    const yearStart = new Date(now.getFullYear(), 0, 1);
    const yearLength = (new Date(now.getFullYear() + 1, 0, 1) - yearStart) / 86400000;
    const day = (now - yearStart) / 86400000;
    const a = -Math.PI / 2 - ((day - CALENDAR_SHIFT) / yearLength) * Math.PI * 2;
    const innerRadius = 205;
    const outerRadius = 245;
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", 300 + innerRadius * Math.cos(a));
    line.setAttribute("y1", 300 + innerRadius * Math.sin(a));
    line.setAttribute("x2", 300 + outerRadius * Math.cos(a));
    line.setAttribute("y2", 300 + outerRadius * Math.sin(a));
    line.setAttribute("class", "today-marker");
    todayMarker.replaceChildren(line);
  }

  //ОТРИСОВКА МАРКЕРОВ
  function draw() {
    drawDivisions();
    markers.innerHTML = "";
    const groups = {};
    // Объединяем людей с одинаковыми датами
    people.forEach(person => {
      const dateKey = key(person.date);
      if (!groups[dateKey]) 
      {groups[dateKey] = [];}
      groups[dateKey].push(person);});
    // Сортируем даты только один раз
    const entries = Object.entries(groups).sort((a, b) => {
      return dayNumber(a[1][0].date) - dayNumber(b[1][0].date);});
    const radii = [218, 222, 214, 224, 210, 220, 216];

    let cluster = [];
    let previousDay = null;

    function drawCluster(items) {
      items.forEach(([dateKey, group], index) => {
        const radius = items.length > 1
          ? radii[index % radii.length]
          : 220;

        const p = point(group[0].date, radius);

        const marker = document.createElementNS(NS, "circle");
        marker.setAttribute("cx", p.x);
        marker.setAttribute("cy", p.y);
        marker.setAttribute("r", 7);
        const markerColor = color(group.map(person => person.name).join("|"));
        marker.setAttribute("fill", markerColor);
        marker.setAttribute("stroke", markerColor);
        marker.setAttribute("class", "marker");
        marker.style.setProperty("--marker-color", markerColor);
        marker.addEventListener("mouseenter", () => {
          show(dateKey, marker);});
        marker.addEventListener("mouseleave", () => {
          hovered = false; setTimeout(checkHide, 150);});
        marker.addEventListener("click", () => {
          show(dateKey, marker);});
        markers.appendChild(marker);});
    }
    //Объединяем близкие даты
    entries.forEach(entry => {
      const currentDay = dayNumber(entry[1][0].date);
      if (previousDay !== null && currentDay - previousDay > 4) {
        drawCluster(cluster);
        cluster = [];}
      cluster.push(entry);
      previousDay = currentDay;});
    if (cluster.length) {
      drawCluster(cluster);}
  }
   
  //ССЫЛКИ В РЕФЕРЕНСАХ
  function formatReferences(value) {
    const text = String(value ?? "").trim();
    if (!text) 
    {return "Не указаны";}
    //Экранируем весь текст
    const escaped = esc(text);
    //Превращаем URL в кликабельные ссылки
    const linked = escaped.replace(
      /https?:\/\/[^\s<]+/gi,
      match => {
        let url = match;
        let punctuation = "";
        //Убираем знаки препинания в конце URL
        while (/[),.!?;:]$/.test(url)) {
          punctuation = url.slice(-1) + punctuation;
          url = url.slice(0, -1);}
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="reference-link">${url}</a>
        ${punctuation}`;});
    return linked.replace(/\r?\n/g, "<br>");
  }

  //СОЗДАНИЕ КАРТОЧКИ ЧЕЛОВЕКА

        </div>

  //ОТОБРАЖЕНИЕ КАРТОЧЕК
  function renderTooltip(element) {
    const keys = [...pinned];
    if (hoveredKey && !keys.includes(hoveredKey)) 
     {keys.push(hoveredKey);}
    if (!keys.length) 
     {tooltip.classList.remove("visible");
      return;}
    tooltip.innerHTML = keys.map(dateKey => {
      const group = people.filter(person => key(person.date) === dateKey);
      return `
        <div class="pinned-group">
          ${
            group.length > 1
              ? `<div class="duplicate">В этот день родились ${group.length} приколыша</div>`
              : ""
          }
          <div class="people">
            ${group.map(personHTML).join("")}
          </div>
          <button class="pin-button" data-key="${esc(dateKey)}">
            ${pinned.includes(dateKey)
                ? "Открепить карточку"
                : "Закрепить карточку"}
          </button>
        </div>`;}).join("");
    tooltip.classList.add("visible");
    //Обработчики кнопок закрепления
    tooltip.querySelectorAll(".pin-button").forEach(button => {
      button.addEventListener("click", () => {togglePin(button.dataset.key);});
    });
    //Автоматическое позиционирование
    if (element && !tooltipDragging && !tooltipMoved) {
      const rect = element.getBoundingClientRect();

      const width = tooltip.offsetWidth;
      const height = tooltip.offsetHeight;

      tooltip.style.left =
        Math.max(8, Math.min(innerWidth - width - 8, rect.right + 10)) + "px";
      tooltip.style.top =
        Math.max(8, Math.min(innerHeight - height - 8, rect.top)) + "px";}
  }

  //ОТКРЫТИЕ КАРТОЧКИ
  function show(dateKey, element) {
    if (!tooltip.classList.contains("visible")) 
    {tooltipMoved = false;}
    hoveredKey = dateKey;
    active = dateKey;
    hovered = true;
    renderTooltip(element);
  }

  //ЗАКРЕПЛЕНИЕ КАРТОЧЕК
  function togglePin(dateKey) {
    if (pinned.includes(dateKey)) 
    {pinned = pinned.filter(item => item !== dateKey);} 
    else {
      //Максимум две закреплённые карточки
      if (pinned.length >= 2) 
      {return;}
      pinned.push(dateKey);}
    renderTooltip();
  }

  //ПЕРЕТАСКИВАНИЕ КАРТОЧКИ
  tooltip.addEventListener("pointerdown", event => {
    //Только основная кнопка мыши
    if (event.button !== 0) 
    {return;}
    //не перетаскиваем карточку при работе
    //со ссылками, кнопками и полями ввода
    if (event.target.closest("a, button, input, textarea, select"))
    {return;}
    tooltipDragging = true;
    const rect = tooltip.getBoundingClientRect();
    dragOffsetX = event.clientX - rect.left;
    dragOffsetY = event.clientY - rect.top;
    tooltip.classList.add("dragging");
    tooltip.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  tooltip.addEventListener("pointermove", event => {
    if (!tooltipDragging) 
    {return;}
    const width = tooltip.offsetWidth;
    const height = tooltip.offsetHeight;
    let x = event.clientX - dragOffsetX;
    let y = event.clientY - dragOffsetY;
    x = Math.max(0, Math.min(innerWidth - width, x));
    y = Math.max(0, Math.min(innerHeight - height, y));
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
    tooltipMoved = true;
  });
  function stopTooltipDrag() {
    tooltipDragging = false;
    tooltip.classList.remove("dragging");
  }
  tooltip.addEventListener("pointerup", stopTooltipDrag);
  tooltip.addEventListener("pointercancel", stopTooltipDrag);
  tooltip.addEventListener("lostpointercapture", stopTooltipDrag);

  //НАВЕДЕНИЕ И СКРЫТИЕ КАРТОЧЕК
  tooltip.addEventListener("mouseenter", () => {hovered = true;});
  tooltip.addEventListener("mouseleave", () => {hovered = false; setTimeout(checkHide, 150);});
  function checkHide() {
    if (hovered) 
    {return;}
    hoveredKey = null;
    active = null;
    if (pinned.length) 
    {renderTooltip();} 
    else {tooltip.classList.remove("visible");}
  }

  //ЗАГРУЗКА GOOGLE ТАБЛИЦЫ
  async function load() {
    if (isLoading) 
    {return;}
    isLoading = true;
    status.textContent = "Подключение к Google Таблице...";
    try {
      const url =
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
        `?tqx=out:json&gid=${SHEET_GID}`;

      const response = await fetch(url, {
        cache: "no-store"});

      if (!response.ok) {
        throw new Error(
          "Google Sheets: HTTP " + response.status);}

      const raw = await response.text();

      const match = raw.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);?\s*$/);

      if (!match) {
        throw new Error(
          "Не удалось прочитать ответ Google. Проверь доступ.");}

      const json = JSON.parse(match[1]);

      if (json.status === "error") {
        throw new Error(
          "Google вернул ошибку при чтении таблицы");}

      const loaded = [];

      (json.table.rows || []).forEach((row, index) => {
        const cells = row.c || [];
        // A — Имя
        const name = String(cells[0]?.v ?? "").trim();
        // B — День рождения
        const date = parseDate(cells[1]?.v, cells[1]?.f);
        // C — Фото
        const image = String(cells[2]?.v ?? "").trim();
        // D — Референсы
        const references = String(cells[3]?.v ?? cells[3]?.f ?? "").trim();
        // E — Интересы
        const interests = String(cells[4]?.v ?? cells[4]?.f ?? "").trim();
        if (!name || !valid(date)) {
          console.warn(
            "Пропущена строка:",
            index + 2);
          return;
        }

        loaded.push({
          name,
          date,
          image,
          references,
          interests});
      });

      //Заменяем данные только после успешной загрузки
      people = loaded;
      draw();
      drawTodayMarker();
      timer();

      //Удаляем закрепления для удалённых дат
      const availableKeys = new Set(people.map(person => key(person.date)));
      pinned = pinned.filter(dateKey => availableKeys.has(dateKey));
      if (pinned.length || hoveredKey) 
      {renderTooltip();} 
        else {tooltip.classList.remove("visible");}
      status.textContent = `Именинников: ${people.length} · Обновлено: ` + new Date().toLocaleTimeString("ru-RU");
      console.log("Загруженные дни рождения:", people);
    } 
    catch (error) {
      status.textContent = "Ошибка: " + error.message;
      console.error("Ошибка загрузки Google Таблицы:", error);
    } 
    finally 
    {isLoading = false;}
  }
  
  //ТАЙМЕР БЛИЖАЙШЕГО ДНЯ РОЖДЕНИЯ
  function getNextBirthdayDate(birthday, now) {
    let year = now.getFullYear();
    function createDate(targetYear) {
      //если год невисокосный, 29 февраля
      //переносим на 1 марта
      if (
        birthday.month === 2 &&
        birthday.day === 29 &&
        !(
          targetYear % 4 === 0 &&
          (targetYear % 100 !== 0 || targetYear % 400 === 0)
        )
      ) 
      {return new Date(targetYear, 2, 1);}
      return new Date(
        targetYear,
        birthday.month - 1,
        birthday.day);
    }
    let date = createDate(year);
    if (date <= now) 
    {date = createDate(year + 1);}
    return date;
  }

  function timer() {
    if (!people.length) {
      timerElement.textContent = "--";
      timerNameElement.textContent = "Нет данных";
      return;}
    const now = new Date();
    const next = people
      .map(person => ({
        person,
        date: getNextBirthdayDate(person.date, now)
      }))
      .sort((a, b) => a.date - b.date)[0];
    const diff = next.date - now;
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor(diff % 86400000 / 3600000);
    const minutes = Math.floor(diff % 3600000 / 60000);
    timerElement.textContent = days
      ? `${days} дн. ${hours} ч.`
      : `${hours} ч. ${minutes} мин.`;
    timerNameElement.textContent = next.person.name;
  }

  //два разных типа видео
  function getBrainrotPair() {
    const types = ["subway", "soap"];
    return types.map(type => {
      const videos = BRAINROT_VIDEOS[type];
      return videos[Math.floor(Math.random() * videos.length)];}
    ).sort(() => Math.random() - 0.5);
  }
  //создание бокового видео
  function addBrainrotVideo(url, side) {
    if (!url) 
    {return;}
    const video = document.createElement("video");
    video.className = `side-brainrot ${side}`;
    video.src = url;
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.preload = "metadata";
    const slot = background.querySelector(
      side === "left"
        ? ".brainrot-left"
        : ".brainrot-right");
    if (!slot) 
    {return;}
    slot.appendChild(video);
    video.play().catch(error => {console.warn("Не удалось запустить боковое видео:", error);});
  }
  //Запуск боковых видео
  function startBrainrot() {
    const [leftVideo, rightVideo] = getBrainrotPair();
    const leftSlot = background.querySelector(".brainrot-left");
    const rightSlot = background.querySelector(".brainrot-right");
    if (!leftSlot || !rightSlot) 
    {return;}
    leftSlot.innerHTML = "";
    rightSlot.innerHTML = "";
    addBrainrotVideo(leftVideo, "left");
    addBrainrotVideo(rightVideo, "right");
  }
  //Отключение боковых видео
  function stopBrainrot() {
    background.querySelectorAll(".side-brainrot").forEach(video => {
      video.pause();
      video.removeAttribute("src");
      video.load();
      video.remove();});
    background.classList.remove("side-mode");
  }

  //УПРАВЛЕНИЕ ФОНОМ
   //безопасная работа с localStorage
  function getBackgroundPreference() {
    try {
      return localStorage.getItem("birthdayGifEnabled") !== "false";} 
    catch (error) {
      console.warn("localStorage недоступен:", error);
      return true;}
  }
  function saveBackgroundPreference(value) {
    try {
      localStorage.setItem(
        "birthdayGifEnabled",
        String(value));} 
    catch (error) {
      console.warn("Не удалось сохранить настройку фона:", error);}
  }
  let gifEnabled = getBackgroundPreference();
  //очистка предыдущего фона
  function clearBackground() {
    background.querySelectorAll("video").forEach(video => {
      video.pause();
      video.removeAttribute("src");
      video.load();});
    background.innerHTML = "";
    background.style.backgroundImage = "none";
  }
  //Выбор доступных фонов
  function getAvailableBackgrounds() {
    return BACKGROUNDS.filter(item => {
      if (!item || !item.url) 
      {return false;}
      return (
        !item.url.includes("ВАШ_ID") &&
        !item.url.includes("example.com"));
    });
  }
  //Создание Embed
  function createEmbed(url, target) {
    let embedUrl = url;
    if (embedUrl.includes("<iframe")) {
      const doc = new DOMParser().parseFromString(embedUrl, "text/html");
      embedUrl = doc
        .querySelector("iframe")
        ?.getAttribute("src");}
    if (!embedUrl) {
      console.error("Некорректный Embed");
      return;}
    const iframe = document.createElement("iframe");
    iframe.src = embedUrl;
    iframe.allow = "autoplay; fullscreen";
    iframe.setAttribute("allowfullscreen", "");
    iframe.setAttribute("loading", "eager");
    iframe.setAttribute("title", "Фоновая анимация");
    target.appendChild(iframe);
  }
  //Основная установка фона
  function setBackground() {
    clearBackground();
    stopBrainrot();
    if (!gifEnabled) {
      backgroundOverlay.style.background = "rgba(8, 12, 19, .96)";
      backgroundToggle.textContent = "Включить фон";
      return;}
    const available = getAvailableBackgrounds();
    if (!available.length) {
      backgroundToggle.textContent = "Включить фон";
      return;}
    const selected = available[Math.floor(Math.random() * available.length)];
    let target = background;
    //Три независимые области
    if (selected.sideVideos) {
      background.classList.add("side-mode");
      background.innerHTML = `
        <div class="brainrot-slot brainrot-left"></div>
        <div class="brainrot-center"></div>
        <div class="brainrot-slot brainrot-right"></div>`;
      target = background.querySelector(".brainrot-center");}
    //Изображение или GIF
    if (selected.type === "image") {
      const img = document.createElement("img");
      img.src = selected.url;
      img.alt = "";
      target.appendChild(img);
      img.onerror = () => {
        console.error(
          "Не удалось загрузить изображение:",
          selected.url);};
    }
    //Видео
    else if (selected.type === "video") {
      const video = document.createElement("video");
      video.src = selected.url;
      video.autoplay = true;
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      target.appendChild(video);
      video.play().catch(error => {
        console.warn("Не удалось запустить видео:", error);});
    }
    //Встроенный контент
    else if (selected.type === "embed") 
    {createEmbed(selected.url, target);}

      "rgba(8, 12, 19, .58)";
    backgroundToggle.textContent = "Отключить фон";
    //Запуск боковых видео
    if (selected.sideVideos) 
    {startBrainrot();}
  }
